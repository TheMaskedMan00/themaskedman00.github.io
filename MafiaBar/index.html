<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mafia Bar Altas Previews</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #111113;
      --panel: #1b1b1f;
      --panel-strong: #24242a;
      --text: #f5f2ed;
      --muted: #b9b2aa;
      --line: #34343c;
      --accent: #d54a45;
      --accent-strong: #f06058;
      --shadow: 0 18px 45px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        linear-gradient(135deg, rgba(213, 74, 69, 0.12), transparent 36%),
        radial-gradient(circle at 85% 15%, rgba(255, 255, 255, 0.08), transparent 26rem),
        var(--bg);
      color: var(--text);
    }

    main {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 44px 0;
    }

    header {
      margin-bottom: 28px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(2rem, 5vw, 4rem);
      line-height: 0.95;
      letter-spacing: 0;
    }

    p {
      margin: 0;
      max-width: 680px;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.6;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .swatch {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .preview {
      display: grid;
      place-items: center;
      min-height: 280px;
      padding: 18px;
      background:
        linear-gradient(45deg, #222 25%, transparent 25%),
        linear-gradient(-45deg, #222 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #222 75%),
        linear-gradient(-45deg, transparent 75%, #222 75%),
        #19191d;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0;
      background-size: 20px 20px;
    }

    .preview img {
      display: block;
      width: 100%;
      max-height: 360px;
      object-fit: contain;
      filter: drop-shadow(0 16px 24px rgba(0, 0, 0, 0.32));
    }

    .details {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px;
      background: var(--panel-strong);
      border-top: 1px solid var(--line);
    }

    h2 {
      margin: 0;
      font-size: 1.05rem;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      padding: 0 14px;
      border: 1px solid transparent;
      border-radius: 6px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: background 150ms ease, border-color 150ms ease, transform 150ms ease;
    }

    .button:hover {
      background: var(--accent-strong);
      transform: translateY(-1px);
    }

    .button.secondary {
      border-color: var(--line);
      background: #151518;
      color: var(--text);
    }

    .button.secondary:hover {
      border-color: #565661;
      background: #202026;
    }

    .toast {
      position: fixed;
      right: 20px;
      bottom: 20px;
      max-width: calc(100% - 40px);
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #202026;
      color: var(--text);
      box-shadow: var(--shadow);
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .toast.visible {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 760px) {
      main {
        width: min(100% - 24px, 560px);
        padding: 28px 0;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .details {
        align-items: flex-start;
        flex-direction: column;
      }

      .actions {
        width: 100%;
        justify-content: stretch;
      }

      .button {
        flex: 1 1 140px;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Mafia Bar Swatches</h1>
      <p>Preview the color variants and grab the texture link you need.</p>
    </header>

    <section class="grid" aria-label="Swatch previews">
      <article class="swatch">
        <div class="preview">
          <img src="https://github.com/TheMaskedMan00/themaskedman00.github.io/blob/Site/MafiaBar/Swatches/SwatchesUpdate_Base_colorRed.png?raw=true" alt="Red Mafia Bar swatch preview">
        </div>
        <div class="details">
          <h2>Red (Default)</h2>
          <div class="actions">
            <a class="button" href="https://github.com/TheMaskedMan00/themaskedman00.github.io/blob/Site/MafiaBar/Swatches/SwatchesUpdate_Base_colorRed.png?raw=true" download>Download</a>
            <button class="button secondary" type="button" data-copy="https://github.com/TheMaskedMan00/themaskedman00.github.io/blob/Site/MafiaBar/Swatches/SwatchesUpdate_Base_colorRed.png?raw=true">Copy Link</button>
          </div>
        </div>
      </article>

      <article class="swatch">
        <div class="preview">
          <img src="https://github.com/TheMaskedMan00/themaskedman00.github.io/blob/Site/MafiaBar/Swatches/SwatchesUpdate_Base_color.png?raw=true" alt="White Mafia Bar swatch preview">
        </div>
        <div class="details">
          <h2>White</h2>
          <div class="actions">
            <a class="button" href="https://github.com/TheMaskedMan00/themaskedman00.github.io/blob/Site/MafiaBar/Swatches/SwatchesUpdate_Base_color.png?raw=true" download>Download</a>
            <button class="button secondary" type="button" data-copy="https://github.com/TheMaskedMan00/themaskedman00.github.io/blob/Site/MafiaBar/Swatches/SwatchesUpdate_Base_color.png?raw=true">Copy Link</button>
          </div>
        </div>
      </article>

      <article class="swatch">
        <div class="preview">
          <img src="https://github.com/TheMaskedMan00/themaskedman00.github.io/blob/Site/MafiaBar/Swatches/SwatchesUpdate_Base_colorPurple.png?raw=true" alt="Purple Mafia Bar swatch preview">
        </div>
        <div class="details">
          <h2>Purple</h2>
          <div class="actions">
            <a class="button" href="https://github.com/TheMaskedMan00/themaskedman00.github.io/blob/Site/MafiaBar/Swatches/SwatchesUpdate_Base_colorPurple.png?raw=true" download>Download</a>
            <button class="button secondary" type="button" data-copy="https://github.com/TheMaskedMan00/themaskedman00.github.io/blob/Site/MafiaBar/Swatches/SwatchesUpdate_Base_colorPurple.png?raw=true">Copy Link</button>
          </div>
        </div>
      </article>

      <article class="swatch">
        <div class="preview">
          <img src="https://github.com/TheMaskedMan00/themaskedman00.github.io/blob/Site/MafiaBar/Swatches/SwatchesUpdate_Base_colorPurplev2.png?raw=true" alt="Deep purple Mafia Bar swatch preview">
        </div>
        <div class="details">
          <h2>Deep Purple</h2>
          <div class="actions">
            <a class="button" href="https://github.com/TheMaskedMan00/themaskedman00.github.io/blob/Site/MafiaBar/Swatches/SwatchesUpdate_Base_colorPurplev2.png?raw=true" download>Download</a>
            <button class="button secondary" type="button" data-copy="https://github.com/TheMaskedMan00/themaskedman00.github.io/blob/Site/MafiaBar/Swatches/SwatchesUpdate_Base_colorPurplev2.png?raw=true">Copy Link</button>
          </div>
        </div>
      </article>
    </section>
  </main>

  <div class="toast" role="status" aria-live="polite"></div>

  <script>
    const toast = document.querySelector(".toast");
    let toastTimer;

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("visible");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove("visible"), 1800);
    }

    async function copyLink(url) {
      try {
        await navigator.clipboard.writeText(url);
        showToast("Link copied");
      } catch {
        const input = document.createElement("textarea");
        input.value = url;
        input.setAttribute("readonly", "");
        input.style.position = "fixed";
        input.style.opacity = "0";
        document.body.appendChild(input);
        input.select();
        document.execCommand("copy");
        input.remove();
        showToast("Link copied");
      }
    }

    document.querySelectorAll("[data-copy]").forEach((button) => {
      button.addEventListener("click", () => copyLink(button.dataset.copy));
    });
  </script>
</body>
</html>
